name: Native GTK checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11
      - name: Install pinned check tools
        run: scripts/check-tools.sh
      - name: Run offline checks
        run: xvfb-run -a dbus-run-session -- env SCREENSHOTS=docs/screenshots scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: acer-fedorizer
          path: |
            publish/acer-fedorizer.tar.gz
            publish/acer-fedorizer.tar.gz.sha256
            docs/screenshots
