name: Native GTK checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11
      - name: Validate shell and Python
        run: |
          bash -n setup.sh run.sh scripts/*.sh
          pipx run ruff==0.16.9 check .
          /usr/bin/python3 -m unittest discover -s tests -v
      - name: Exercise GTK interface with preview data
        run: xvfb-run -a dbus-run-session -- env GSK_RENDERER=cairo /usr/bin/python3 scripts/ui-smoke.py
      - name: Render screenshots of real widgets
        run: xvfb-run -a dbus-run-session -- env GSK_RENDERER=cairo ./run.sh --screenshots docs/screenshots
      - name: Package source and application
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: acer-fedorizer
          path: |
            publish/acer-fedorizer.tar.gz
            publish/acer-fedorizer.tar.gz.sha256
            docs/screenshots
